[workspace]
authors = ["Lee Penkman <leepenkman@gmail.com>"]
channels = ["https://conda.modular.com/max-nightly", "conda-forge"]
name = "mojo-potpourri3d"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
build = "bash build/build.sh"
test = "python -m pytest tests -q"
bench = "flock /tmp/mojo-bench.lock python bench/bench.py"

[activation.env]
PYTHONPATH = "python"

[dependencies]
mojo = "==1.2.0.dev2026092905"
python = "3.13.*"
# `max` is released in lockstep with `mojo`; this exact build pairs with mojo 1.2.0.dev2026092905.
max = "==26.7.0.dev2026092905"
pytest = "*"
numpy = "*"
scipy = "*"

# conda-forge only builds potpourri3d for CPython 3.11, so the reference
# implementation comes from PyPI, which ships a cp313 wheel.
[pypi-dependencies]
potpourri3d = "==1.4.0"
